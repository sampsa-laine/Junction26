[project]
name = "junction26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.26.0",
    "modal>=1.6.4",
]

[project.scripts]
junction26 = "junction26.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--doctest-modules --import-mode=importlib"
testpaths = ["test", "src"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
